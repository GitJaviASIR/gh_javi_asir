<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        table, td,th,tr{
            border: 1px solid black;
            text-align: center;
        }
        #tabla3, #tabla3 td{
            padding:10px;
        }
        #tabla4{
            padding: 5px;
        }
        #micro td{
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Mis primeras tablas</h1>
    <p>
        <h2>Tabla 1</h2>
        <table>
            <tr>
                <th>Posición</th>
                <th>Nombre</th>
                <th>Nota</th>
            </tr>
            <tr>
                <td rowspan="2">1º</td>
                <td>Laura Gómez</td>
                <td>9,2</td>
            </tr>
            <tr>
                <td>Iván Martínez</td>
                <td>9,2</td>
            </tr>
        </table>
    </p>
    <p>
        <h2>Tabla 2</h2>
        <table>
            <tr>
                <th>Posición</th>
                <th>Nombres</th>
                <th>Nota</th>
            </tr>
            <tr>
                <td>1º</td>
                <td colspan="2">Javi 10</td>
            </tr>
            <tr>
                <td>1º</td>
                <td>Pedro</td>
                <td>10</td>
            </tr>
        </table>
    </p>
    <p>
        <h2>Tabla 3</h2>
        <table id="tabla3">
            <tr>
                <td>1</td>
                <td colspan="2">2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>
            <tr>
                <td rowspan="2">6</td>
                <td>7</td>
                <td>8</td>
            </tr>
            <tr>
                <td>9</td>
                <td>10</td>
            </tr>
        </table>
    </p>
    <p>
        <h2>Tabla 4</h2>
        <table id="tabla4">
            <tr>
                <td>1</td>
                <td>
                    <table id="micro">
                        <tr>
                            <td>1</td>
                            <td>2</td>
                            <td>3</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>5</td>
                            <td>6</td>
                        </tr>
                        <tr>
                            <td>7</td>
                            <td>8</td>
                            <td>9</td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>3</td>
            </tr>
        </table>
    </p>
</body>
</html>
