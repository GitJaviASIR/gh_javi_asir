<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
    <style>
        .bloque{
            background-color: #FF595E;
            width: 360px;
            padding: 30px;
            margin: 30px auto;
            box-sizing: border-box;
        }
        .t1 td{
            background-color: #1BA169;
            width: 100px;
            padding: 0;
            min-height: 100px;
            height: 50px;
            text-align: center;
        }
        .t2 td{
            background-color: #1BA169;
            width: 100px;
            padding: 0;
            min-height: 100px;
            height: 50px;
            text-align: center;
        }
        .emoji{
            font-size: 30px;
            margin: 0;
        }
        .texto{
            color:white;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <div class="bloque">
        <table class="t1">
                <tr>
                    <td><p class="emoji">🏋️</p><p class="texto">Personal</p></td>
                    <td><p class="emoji">🎖️</p><p class="texto">Exclusivo</p></td>
                    <td><p class="emoji">🕺</p><p class="texto">Zumba</p></td>
                </tr>
        </table>
        <table class="t2">
                <tr>
                    <td><p class="emoji">🧘‍♀️</p><p class="texto">Yoga</p></td>
                    <td><p class="emoji">♨</p><p class="texto">Sauna</p></td>
                    <td><p class="emoji">📅</p><p class="texto">Abierto 24/7</p></td>
                </tr>
        </table>
    </div>
</body>
</html>
