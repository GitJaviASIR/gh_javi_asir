<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraordinaria</title>
    <style>
        p {
            font-size: 16px;
        }

        div {
            border: 2px solid blue;
        }

        h1 {
            color: blue;
        }

        h2 {
            color: green;
            background-color: white;
        }

        body {
            background-image: url(""");
        }
    </style>
</head>
<body>
    <h1>Este es mi examen</h1>
    <p>
        <a href="https://www.vedoque.com">
            Esta es una buena página
        </a>
    </p>
    <figure>
        <img src="img/paisaje.webp"
             height="100"
             alt="Paisaje">
        <figcaption>Esta es una gran imagen.</figcaption>
    </figure>
    <div>
        <h2>El examen está siendo fácil</h2>
        <p>No esperaba que fuera tan fácil</p>
    </div>
    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td>Alumno 1</td>
            <td>8</td>
        </tr>
        <tr>
            <td>Alumno 2</td>
            <td>7</td>
        </tr>
        <tr>
            <td>Alumno 3</td>
            <td>9</td>
        </tr>
    </table>
    <h2>Formulario</h2>
    <form>
        <p>Nombre:</p>
        <input type="text" name="nombre">
        <p>Ciclo:</p>
        <select name="ciclo">
            <option>ASIR</option>
            <option>DAM</option>
            <option>DAW</option>
        </select>
        <p>Curso:</p>
        <input type="radio" name="curso" value="1">
        Primero
        <input type="radio" name="curso" value="2">
        Segundo
        <p>Estudios anteriores:</p>
        <input type="checkbox" name="bachillerato">
        Bachillerato
        <input type="checkbox" name="smr">
        SMR
    </form>
    <footer>
        <p>Hoy sí que voy a aprobar.</p>
    </footer>
</body>
</html>
