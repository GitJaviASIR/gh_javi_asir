<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo CSS</title>
    <style>
        ul.menu > li {
            color: red;
            font-size: 20px;
        }
        h2 + p {
            color: green;

        }
        input[type="text"]{
            border: 3px solid red;
        }
        .verde:hover{
            font-weight:bold;
            font-size: 30px;
            background-image: url(img/cage.webp);
            background-size: 20%;
            background-repeat: no-repeat;
        }
        .verde{
            color: green;
        }
        .rojo{
            color: red;
        }
        .rojo::first-letter {
                font-size: 2.5em;
                font-weight: bold;
                color: red;
        }
        input:focus{
            border: 5px red dashed;
        }
        tr:nth-child(odd) {
            background-color: yellow;
        }
        .bloque{
            width: 40%;
            height: 50%;
            border: 4px solid red;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <ul class="menu">
        <li>
            Firts option
        </li>
        <ul>
            <li>
                Second option
            </li>
        </ul>
        <li>Third option</li>
        </ul>
    </ul>
    <h2>Encabezado 2</h2>
    <p>primer parrafo</p>
    <p>segundo parrafo</p>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" placeholder="Aqui escribe el nombre" id="nombre"/>
        <label for="edad">Edad:</label>
        <input type="number" step="5" id="edad"/>
        <input type="submit" value="Enviar"/>
    </form>
    <p class="verde">Alfredo en verde</p>
    <p class="rojo">Alfredo en rojo</p>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
    </table>
    <div class="bloque">
            Hello there
            <img src="img/cage.webp" style="margin: 0px auto; display: block; width: 100% ;">
    </div>
</body>
</html>
